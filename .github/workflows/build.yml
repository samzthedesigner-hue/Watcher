name: Build engine
on:
  push:
    branches: [main]
    paths: [CMakeLists.txt, llama_jni.cpp, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-march=armv8.2-a+dotprod" \
            -DCMAKE_CXX_FLAGS="-march=armv8.2-a+dotprod"

      - name: Build
        run: cmake --build build --config Release -j4

      - name: Strip
        run: |
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/libllama.so
          ls -l build/libllama.so

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: engine-latest
          name: Engine latest
          make_latest: true
          files: build/libllama.so
